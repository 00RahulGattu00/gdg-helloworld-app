<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="greeting">Hello World!</h1>
        
    <!-- Theme Selector -->
        <div class="controls-section">
            <h3>Theme</h3>
            <div class="theme-buttons">
                <button class="theme-btn active" data-theme="gradient">Colorful</button>
                <button class="theme-btn" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="light">Light</button>
            </div>
        </div>

<!-- Animation Selector -->
        <div class="controls-section">
            <h3>Animation</h3>
            <select id="animationSelect">
                <option value="fade">Fade</option>
                <option value="slide">Slide</option>
                <option value="bounce">Bounce</option>
                <option value="zoom">Zoom</option>
            </select>
        </div>

        <!-- Custom Message Input -->
        <div class="controls-section">
            <h3>Custom Message</h3>
            <input type="text" id="customMessageInput" placeholder="Enter your message...">
            <button id="addMessageBtn">Add Message</button>
        </div>

        <!-- Main Controls -->
        <div class="main-controls">
            <button id="changeTextBtn">Change Text</button>
            <button id="autoCycleBtn">Auto Cycle: OFF</button>
        </div>

        <!-- Sound Controls -->
        <div class="controls-section">
            <button id="soundToggleBtn">🔊 Sound: ON</button>
        </div>

        <!-- Statistics -->
        <div class="stats-section">
            <p>Button clicks: <span id="clickCount">0</span></p>
            <p>Messages: <span id="messageCount">5</span></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
